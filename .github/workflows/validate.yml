#==============================================================================
# SHARED HOST AUTOMATION VALIDATION
#==============================================================================

name: Validate host automation

#==============================================================================
# WORKFLOW TRIGGERS
#==============================================================================

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

#==============================================================================
# WORKFLOW PERMISSIONS AND CONCURRENCY
#==============================================================================

permissions:
  contents: read

concurrency:
  group: host-automation-validation-${{ github.ref }}
  cancel-in-progress: true

#==============================================================================
# HOST AUTOMATION VALIDATION
#==============================================================================

jobs:
  validate:
    uses: bharathadigopula/github-pipeline-templates/.github/workflows/shell-validate.yml@v0.7.0
    with:
      search_path: scripts
    permissions:
      contents: read

  validate-cloudflared-bootstrap:
    name: Validate cloudflared bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate OCI payload and secret handling
        run: bash scripts/validate.sh